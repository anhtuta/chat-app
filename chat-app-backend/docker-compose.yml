version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:18-alpine
    container_name: chat-app-postgres
    environment:
      POSTGRES_DB: chatdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-5555}
    ports:
      - "5434:5432"
    volumes:
      - ./docker/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chat-network

  # Redis (for sessions, cache, and pub/sub)
  redis:
    image: redis:7-alpine
    container_name: chat-app-redis
    # Use config file + command for password (password must be set via command line)
    command: redis-server /etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:-redis123}
    ports:
      - "6379:6379"
    volumes:
      - ./docker/data/redis:/data
      - ./docker/config/redis/redis.conf:/etc/redis/redis.conf:ro
    healthcheck:
      # Use the same password as the server (interpolated from env/.env)
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis123} ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - chat-network

  # RabbitMQ (currently used, can be removed when migrating to Redis pub/sub)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: chat-app-rabbitmq
    hostname: rabbitmq
    environment:
      # Keep the Erlang node name stable across container recreation when using a persisted data dir.
      RABBITMQ_NODENAME: rabbit@rabbitmq
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - ./docker/data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      # Authenticated aliveness test (publish/consume on vhost /) — port/UI up is not enough for AmqpAdmin.
      # Uses management HTTP (not rabbitmq-diagnostics) to avoid the Erlang CLI healthcheck memory leak in docs/25.
      test:
        [
          "CMD-SHELL",
          "wget -qO- \"http://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@127.0.0.1:15672/api/aliveness-test/%2F\" | grep -q '\"status\":\"ok\"'",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - chat-network

  # MinIO (local object storage for media uploads)
  minio:
    image: minio/minio:latest
    container_name: chat-app-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${CHAT_MEDIA_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${CHAT_MEDIA_MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./docker/data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chat-network

  # Spring Boot Application
  # Compose auto-tags the built image as <project-name>-<service-name>. So the image will be chat-app-instance-1
  instance-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat-app-instance-1
    environment:
      SPRING_APPLICATION_NAME: chat-app
      SPRING_APPLICATION_INSTANCE_ID: ${INSTANCE_ID_1:-instance-1}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chatdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-5555}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      SPRING_SESSION_STORE_TYPE: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      CHAT_MEDIA_PROVIDER: ${CHAT_MEDIA_PROVIDER:-MINIO}
      CHAT_MEDIA_MINIO_ENDPOINT: ${CHAT_MEDIA_MINIO_ENDPOINT:-http://minio:9000}
      CHAT_MEDIA_MINIO_ACCESS_KEY: ${CHAT_MEDIA_MINIO_ACCESS_KEY:-minioadmin}
      CHAT_MEDIA_MINIO_SECRET_KEY: ${CHAT_MEDIA_MINIO_SECRET_KEY:-minioadmin}
      CHAT_MEDIA_MINIO_BUCKET: ${CHAT_MEDIA_MINIO_BUCKET:-chat-media}
      CHAT_MEDIA_MINIO_REGION: ${CHAT_MEDIA_MINIO_REGION:-us-east-1}
      SERVER_PORT: 9010
      LOGGING_LEVEL_COM_HELLO_CHATAPP: ${LOG_LEVEL:-INFO}
    ports:
      - "9010:9010"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - chat-network
    restart: unless-stopped

  # Optional: Second app instance for testing multi-instance setup
  instance-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat-app-instance-2
    environment:
      SPRING_APPLICATION_NAME: chat-app
      SPRING_APPLICATION_INSTANCE_ID: ${INSTANCE_ID_2:-instance-2}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chatdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-5555}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      SPRING_SESSION_STORE_TYPE: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      CHAT_MEDIA_PROVIDER: ${CHAT_MEDIA_PROVIDER:-MINIO}
      CHAT_MEDIA_MINIO_ENDPOINT: ${CHAT_MEDIA_MINIO_ENDPOINT:-http://minio:9000}
      CHAT_MEDIA_MINIO_ACCESS_KEY: ${CHAT_MEDIA_MINIO_ACCESS_KEY:-minioadmin}
      CHAT_MEDIA_MINIO_SECRET_KEY: ${CHAT_MEDIA_MINIO_SECRET_KEY:-minioadmin}
      CHAT_MEDIA_MINIO_BUCKET: ${CHAT_MEDIA_MINIO_BUCKET:-chat-media}
      CHAT_MEDIA_MINIO_REGION: ${CHAT_MEDIA_MINIO_REGION:-us-east-1}
      SERVER_PORT: 9010
      LOGGING_LEVEL_COM_HELLO_CHATAPP: ${LOG_LEVEL:-INFO}
    ports:
      - "9011:9010"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - chat-network
    restart: unless-stopped
    profiles:
      - multi-instance

  # Optional: Third app instance for testing multi-instance setup
  instance-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat-app-instance-3
    environment:
      SPRING_APPLICATION_NAME: chat-app
      SPRING_APPLICATION_INSTANCE_ID: ${INSTANCE_ID_3:-instance-3}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chatdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-5555}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      SPRING_SESSION_STORE_TYPE: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      CHAT_MEDIA_PROVIDER: ${CHAT_MEDIA_PROVIDER:-MINIO}
      CHAT_MEDIA_MINIO_ENDPOINT: ${CHAT_MEDIA_MINIO_ENDPOINT:-http://minio:9000}
      CHAT_MEDIA_MINIO_ACCESS_KEY: ${CHAT_MEDIA_MINIO_ACCESS_KEY:-minioadmin}
      CHAT_MEDIA_MINIO_SECRET_KEY: ${CHAT_MEDIA_MINIO_SECRET_KEY:-minioadmin}
      CHAT_MEDIA_MINIO_BUCKET: ${CHAT_MEDIA_MINIO_BUCKET:-chat-media}
      CHAT_MEDIA_MINIO_REGION: ${CHAT_MEDIA_MINIO_REGION:-us-east-1}
      SERVER_PORT: 9010
      LOGGING_LEVEL_COM_HELLO_CHATAPP: ${LOG_LEVEL:-INFO}
    ports:
      - "9012:9010"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - chat-network
    restart: unless-stopped
    profiles:
      - multi-instance

  # Prometheus (Metrics collection)
  prometheus:
    image: prom/prometheus:latest
    container_name: chat-app-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/data/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - chat-network
    restart: unless-stopped
    # depends_on:
    #   - instance-1

  # Grafana (Visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: chat-app-grafana
    ports:
      - "3010:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ./docker/data/grafana:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - chat-network
    restart: unless-stopped
    depends_on:
      - prometheus

# volumes:
# All services now use bind mounts in ./docker/data/ directory
# No named volumes needed

networks:
  chat-network:
    driver: bridge
