  #   metrics_path: '/actuator/prometheus'
  #   scrape_interval: 30s
  #   # Only scrape if multi-instance profile is enabled

  # - job_name: 'chat-app-instance-3'
  #   static_configs:
  #     - targets: ['instance-3:9010']
  #   metrics_path: '/actuator/prometheus'
  #   scrape_interval: 30s
  #   # Only scrape if multi-instance profile is enabled

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
