spring:
  application:
    name: chat-app
    # Unique instance ID for multi-instance deployments
    # Each instance should have a unique ID (e.g., instance-1, instance-2) (specified when running the application)
    # If not specified, can use a random UUID like this: ${HOSTNAME:instance-${random.uuid}}, or use "instance-dev" for local development
    instance-id: ${HOSTNAME:instance-dev}
  datasource:
    url: jdbc:postgresql://localhost:5434/chatdb
    username: postgres
    password: ${POSTGRES_PASSWORD:5555}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  data:
    redis:
      host: localhost
      password: ${REDIS_PASSWORD:redis123}
      port: 6379
  session:
    redis:
      flush-mode: on_save
      namespace: chatapp
  task:
    execution:
      pool:
        core-size: 10
        max-size: 100
        queue-capacity: 500
        keep-alive: 60s
        thread-name-prefix: ws-handler-
      shutdown:
        await-termination: true
        await-termination-period: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,threaddump,metrics-tags
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        tomcat.threads.busy: true
        tomcat.threads.current: true

server:
  port: 9010
  servlet:
    session:
      timeout: 43200 # If a duration suffix is not specified, seconds is used.

logging:
  level:
    com.hello.chatapp: ${LOG_LEVEL:DEBUG}
  file:
    path: ./docker/logs
    max-history: 30
    max-size: 100MB
    file-size-threshold: 10MB
    file-rolling-policy:
      type: size
      size-threshold: 10MB
      max-history: 30
      file-name-pattern: chat-app-%d{yyyy-MM-dd}.log
      strategy:
        type: time

chat:
  media:
    provider: ${CHAT_MEDIA_PROVIDER:MINIO}
    max-image-count: ${CHAT_MEDIA_MAX_IMAGE_COUNT:50}
    retention-days: ${CHAT_MEDIA_RETENTION_DAYS:60}
    multipart-threshold-bytes: ${CHAT_MEDIA_MULTIPART_THRESHOLD_BYTES:10485760}
    upload-session-ttl-minutes: ${CHAT_MEDIA_UPLOAD_SESSION_TTL_MINUTES:15}
    upload-url-ttl-minutes: ${CHAT_MEDIA_UPLOAD_URL_TTL_MINUTES:15}
    read-url-ttl-minutes: ${CHAT_MEDIA_READ_URL_TTL_MINUTES:60}
    max-size:
      image-bytes: ${CHAT_MEDIA_MAX_SIZE_IMAGE_BYTES:10485760}
      audio-bytes: ${CHAT_MEDIA_MAX_SIZE_AUDIO_BYTES:52428800}
      video-bytes: ${CHAT_MEDIA_MAX_SIZE_VIDEO_BYTES:209715200}
      file-bytes: ${CHAT_MEDIA_MAX_SIZE_FILE_BYTES:20971520}
    minio:
      endpoint: ${CHAT_MEDIA_MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${CHAT_MEDIA_MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${CHAT_MEDIA_MINIO_SECRET_KEY:minioadmin}
      bucket: ${CHAT_MEDIA_MINIO_BUCKET:chat-media}
      region: ${CHAT_MEDIA_MINIO_REGION:us-east-1}
      path-style-access: ${CHAT_MEDIA_MINIO_PATH_STYLE_ACCESS:true}
    s3:
      bucket: ${CHAT_MEDIA_S3_BUCKET:chat-media}
      region: ${CHAT_MEDIA_S3_REGION:ap-southeast-1}
      endpoint: ${CHAT_MEDIA_S3_ENDPOINT:}
      path-style-access: ${CHAT_MEDIA_S3_PATH_STYLE_ACCESS:false}
