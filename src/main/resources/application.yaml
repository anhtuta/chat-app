spring:
  application:
    name: chat-app
    # Unique instance ID for multi-instance deployments
    # Each instance should have a unique ID (e.g., instance-1, instance-2) (specified when running the application)
    # If not specified, can use a random UUID like this: ${HOSTNAME:instance-${random.uuid}}, or use "instance-dev" for local development
    instance-id: ${HOSTNAME:instance-dev}
  datasource:
    url: jdbc:postgresql://localhost:5434/chatdb
    username: postgres
    password: ${POSTGRES_PASSWORD:-5555}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER:-guest}
    password: ${RABBITMQ_PASSWORD:-guest}
  data:
    redis:
      host: localhost
      password: ${REDIS_PASSWORD:-redis123}
      port: 6379
  session:
    redis:
      flush-mode: on_save
      namespace: chatapp

server:
  port: 9010
  servlet:
    session:
      timeout: 1800 # If a duration suffix is not specified, seconds is used.

logging:
  level:
    com.hello.chatapp: DEBUG
  file:
    path: ./docker/logs
    max-history: 30
    max-size: 100MB
    file-size-threshold: 10MB
    file-rolling-policy:
      type: size
      size-threshold: 10MB
      max-history: 30
      file-name-pattern: chat-app-%d{yyyy-MM-dd}.log
      strategy:
        type: time
