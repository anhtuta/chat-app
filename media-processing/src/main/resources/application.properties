#Fri Aug 07 14:26:36 UTC 2026
micronaut.application.name=media-processing
micronaut.server.port=9020

media-processing.worker.enabled=${MEDIA_PROCESSING_WORKER_ENABLED:false}
media-processing.worker.handoff=RABBITMQ
media-processing.worker.queue=media.processing.jobs
media-processing.worker.consumer-concurrency=1
media-processing.worker.max-retries=3
media-processing.worker.feature-flags.video-metadata=true
media-processing.worker.feature-flags.video-poster=true
media-processing.worker.feature-flags.video-transcode=true
media-processing.worker.feature-flags.video-mobile-renditions=true
media-processing.worker.feature-flags.video-ocr=false
media-processing.worker.feature-flags.speech-to-text=false
media-processing.worker.feature-flags.image-processing=false
media-processing.worker.feature-flags.image-ocr=false

media-processing.video-metadata.ffprobe-path=ffprobe
media-processing.video-metadata.timeout-seconds=30

media-processing.video-poster.ffmpeg-path=ffmpeg
media-processing.video-poster.timeout-seconds=60
media-processing.video-poster.capture-second=1.0
media-processing.video-poster.max-width=1280
media-processing.video-poster.jpeg-quality=2

media-processing.video-transcode.ffmpeg-path=ffmpeg
media-processing.video-transcode.timeout-seconds=300
media-processing.video-transcode.video-crf=23
media-processing.video-transcode.preset=veryfast
media-processing.video-transcode.audio-bitrate=128k

media-processing.video-rendition.ffmpeg-path=ffmpeg
media-processing.video-rendition.timeout-seconds=180
media-processing.video-rendition.video-crf=26
media-processing.video-rendition.preset=veryfast
media-processing.video-rendition.audio-bitrate=96k
media-processing.video-rendition.max-height=480
media-processing.video-rendition.min-duration-seconds=15
media-processing.video-rendition.min-canonical-size-bytes=8388608

media-processing.storage.provider=MINIO
media-processing.storage.local-development=${MEDIA_PROCESSING_STORAGE_LOCAL_DEVELOPMENT:true}
media-processing.storage.minio.endpoint=${MEDIA_PROCESSING_MINIO_ENDPOINT:http://localhost:9000}
media-processing.storage.minio.access-key=${MEDIA_PROCESSING_MINIO_ACCESS_KEY:minioadmin}
media-processing.storage.minio.secret-key=${MEDIA_PROCESSING_MINIO_SECRET_KEY:minioadmin}
media-processing.storage.minio.region=${MEDIA_PROCESSING_MINIO_REGION:us-east-1}
media-processing.storage.minio.path-style-access=${MEDIA_PROCESSING_MINIO_PATH_STYLE_ACCESS:true}

media-processing.workspace.base-directory=${java.io.tmpdir}/media-processing
media-processing.workspace.cleanup-enabled=true

# Local testing only, to test video transcoding without chat-app-backend. Disabled by default.
media-processing.local-trigger.enabled=${MEDIA_PROCESSING_LOCAL_TRIGGER_ENABLED:false}
media-processing.local-trigger.default-bucket=chat-media

media-processing.callback.enabled=${MEDIA_PROCESSING_CALLBACK_ENABLED:false}
media-processing.callback.base-url=${CHAT_APP_BACKEND_URL:http://localhost:9010}
media-processing.callback.token=${MEDIA_PROCESSING_CALLBACK_TOKEN:change-me-in-production}

rabbitmq.uri=${RABBITMQ_URI:amqp://guest:guest@localhost:5672}
